name: Release

# A tag is the trigger, and the only one that publishes. workflow_dispatch runs
# the identical build and packaging so the whole path can be exercised without
# creating a release nobody wanted: the acceptance for this workflow is "push a
# tag and get downloadable files", and rehearsing that must not mean tagging
# something first to find out the YAML is wrong.
#
# Nothing here runs on a pull request. A fork's PR cannot reach the token that
# publishes, because no pull_request trigger exists to reach it with.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build as, e.g. v0.1.0. Nothing is published."
        required: true
        type: string

# Read by default; only the publishing job asks for more, and only for the
# duration of that job.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOSEC_VERSION: v2.29.0
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  # A tag is not a promise that the code was ever tested: it can be pushed at
  # any commit, including one that never passed CI. The gates that guard main
  # run again here against the exact tree being released.
  verify:
    name: gates at the tag
    runs-on: ubuntu-latest
    steps:
      # First, because the trigger is broader than the grammar: `v*` matches a
      # mistyped v1 or v1.2.3.4, and the tag is already on the remote by the
      # time this runs. Refusing here costs a minute instead of a full race-test
      # and vulnerability scan before the build job says the same thing.
      - name: the tag is a version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing to release \"$tag\": want vMAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          echo "releasing $tag"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # -count=1 because the point is to run them, not to learn that a cache
      # entry from a main build says they passed.
      - run: go test -race -count=1 ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: gosec
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          "$(go env GOPATH)/bin/gosec" -quiet ./...

  build:
    name: package ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: resolve the tag being built
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          # A grammar, not a prefix. A prefix check admitted "v1 with space",
          # which breaks -ldflags, "v1/../x", which climbs out of the staging
          # directory, and a value with a newline, which writes extra keys into
          # $GITHUB_OUTPUT. Nothing here can execute — the value arrives through
          # env: and is only ever quoted — but none of those should build.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing to build \"$tag\": want vMAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag"

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Checked before anything is written: the version check below reads
          # "modified source" for any untracked path, so a build directory that
          # is not ignored would fail this job with a message about the source
          # tree rather than about itself. /stage/ and /dist/ are in .gitignore
          # for that reason, and this says so if one of them stops being.
          if [ -n "$(git status --porcelain)" ]; then
            echo "the tree is not clean before the build:"
            git status --porcelain
            exit 1
          fi
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          bundle="agenthub_${TAG}_${GOOS}_${GOARCH}"
          mkdir -p "stage/${bundle}"
          for command in agenthub-node ah agenthub-mcp; do
            # -X is what makes `ah --version` answer with the tag instead of a
            # revision. Everything else about the build matches CI's, so a
            # release binary differs from a CI one only in that string.
            go build -trimpath \
              -ldflags "-X agenthub.local/agenthub/internal/buildinfo.release=${TAG}" \
              -o "stage/${bundle}/${command}${suffix}" "./cmd/${command}"
          done
          cp README.md LICENSE "stage/${bundle}/"
          echo "bundle=$bundle" >> "$GITHUB_ENV"

      # The tag has to be what the binary says, or the release is mislabelled in
      # the one place a user looks. Only the native pair can run here; the
      # -ldflags value is identical for every platform, so this holds for all of
      # them or none.
      - name: the binary reports the tag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          reported=$("./stage/${bundle}/ah" --version)
          echo "$reported"
          case "$reported" in
            *"modified source"*)
              echo "the tree was not clean at this tag: $reported"; git status --porcelain; exit 1 ;;
          esac
          case "$reported" in
            "ah ${TAG} "*) ;;
            *) echo "ah --version does not lead with ${TAG}"; exit 1 ;;
          esac

      # tar for the platforms whose users expect it, and because the executable
      # bit survives it. zip for Windows, where tar is not the convention and
      # the bit means nothing.
      - name: archive
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -q -r "../dist/${bundle}.zip" "$bundle")
          else
            tar -C stage -czf "dist/${bundle}.tar.gz" "$bundle"
          fi
          # Named for the archive rather than left as a bare SHA256SUMS: six
          # jobs upload into one directory later, and six files of the same
          # name would be one file.
          (cd dist && sha256sum "${bundle}."* > "${bundle}.sha256")
          cat "dist/${bundle}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          # Re-running all jobs of a run would otherwise fail here: the names
          # are per-run, and this action refuses an existing one by default.
          overwrite: true

  # The desktop app is the product a non-developer downloads, and until #64 it
  # was the one thing a release did not contain: the build job above cross-
  # compiles three command line binaries from one Linux runner, which no amount
  # of GOOS can turn into a .app, an NSIS installer or a GTK/WebKit binary.
  # Wails links against each platform's own UI toolkit through cgo, so this job
  # is a matrix of real runners rather than a matrix of environment variables.
  #
  # Only amd64 for Windows and Linux: GitHub has no arm64 runner for either on
  # the free plan, and a cross-compiled cgo build is not a thing that happens by
  # accident. macOS is universal, so one download serves both Apple architectures.
  desktop:
    name: desktop ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/universal
            runner: macos-latest
            slug: darwin_universal
          - platform: windows/amd64
            runner: windows-latest
            slug: windows_amd64
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # desktop/go.mod, not go.mod: this job compiles the desktop module, and
      # its toolchain floor is the one that has to be met. The bundled command
      # line binaries come from the root module, which declares the same floor.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: resolve the tag being built
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          # Same grammar as the build job, and for the same reasons: the value
          # reaches -ldflags, a file name and a volume name from here.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing to build \"$tag\": want vMAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag"

      # Wails on Linux binds GTK and WebKit through cgo. wails v2.15 selects
      # webkit2gtk-4.0 unless the webkit2_41 build tag is set, and ubuntu-latest
      # only ships the 4.1 development package — so the tag below and this
      # package list are one decision, not two.
      - name: wails build dependencies (linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # windows-latest does not ship NSIS, and wails does not treat its absence
      # as an error: it prints "Cannot create installer: makensis not found"
      # and exits 0, so without this the job would build a .exe, skip the
      # installer and look successful. The PATH line is separate because the
      # installer does not add it, and wails looks makensis up on PATH.
      #
      # Fetched and checksummed rather than `choco install nsis`: every other
      # dependency of this workflow is pinned, and the Chocolatey community feed
      # was the one floating source on the job that builds the published
      # installer. The digest below was taken from four independent sources that
      # agree byte for byte:
      #
      #   https://netix.dl.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12-setup.exe
      #   https://netactuate.dl.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12-setup.exe
      #   https://deac-riga.dl.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12-setup.exe
      #   tools/nsis-3.12-setup.exe inside the chocolatey nsis.install 3.12.0 package
      #
      # The last of those is what `choco install nsis` was handing this job, so
      # the pin changes where the bytes come from and not which bytes they are.
      # Bumping the version means replacing both the version and the digest, and
      # the digest has to be re-derived the same way.
      - name: install NSIS (windows)
        if: matrix.runner == 'windows-latest'
        env:
          NSIS_VERSION: "3.12"
          NSIS_SHA256: 3bc2b06253a7e4957111be152ac6a536e0c7478a706e19da814038db5d706495
        run: |
          set -euo pipefail
          url="https://downloads.sourceforge.net/project/nsis/NSIS%203/${NSIS_VERSION}/nsis-${NSIS_VERSION}-setup.exe"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output nsis-setup.exe "$url"
          # Verified before the file is ever executed: a digest checked after
          # the fact is a record of what ran, not a gate on it.
          echo "${NSIS_SHA256}  nsis-setup.exe" | sha256sum --check --strict -
          # MSYS_NO_PATHCONV/MSYS2_ARG_CONV_EXCL because this shell is Git
          # Bash: it rewrites an argument shaped like a POSIX path before the
          # Windows program sees it, and NSIS's silent flag /S is exactly that
          # shape. Rewritten, the installer runs interactively and the job hangs
          # until the six-hour limit.
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' ./nsis-setup.exe /S
          rm -f nsis-setup.exe || true
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      # Pinned to whatever desktop/go.mod requires, read from the module rather
      # than typed here: a CLI newer than the library it drives generates
      # bindings and templates the library does not expect, and @latest would
      # make every release a different build of the same tag.
      - name: install the wails CLI pinned to the module
        working-directory: desktop
        run: |
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "wails CLI ${wails_version}"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # AGENTHUB_RELEASE is what actually stamps the tag: bundle-binaries.sh
      # reads it and rebuilds ah, agenthub-node and agenthub-mcp with the same
      # -X the standalone archives get, so the copies inside the bundle answer
      # `--version` with the tag rather than a revision.
      #
      # -ldflags stamps the desktop binary itself. `main.release` is the one the
      # window reads (desktop/buildinfo.go) and reports in its title bar; the
      # internal/buildinfo one is for the day the desktop module links the root
      # module — the Go linker ignores an -X naming a symbol that is not there,
      # so carrying it costs nothing and losing it would be silent.
      #
      # info.productVersion is a separate fact from the ldflag and has to be set
      # separately: it is what wails templates into Info.plist
      # (CFBundleShortVersionString), into build/windows/info.json and into the
      # NSIS installer's version. wails.json does not carry it, because the
      # version belongs to the tag and not to the checkout — unset, wails writes
      # "1.0.0", and every artifact of every release claims the same version.
      #
      # Windows gets the numeric part only: that value reaches goversioninfo's
      # fixed.file_version, which is a four-number Windows VERSIONINFO field and
      # not a place a "-rc.1" suffix can go. macOS and Linux get the full tag.
      #
      # -nsis on Windows: the installer is the point of that platform, and the
      # bundling hook has to have run first, because project.nsi packages
      # ..\..\bin\ah.exe from where the hook put it.
      - name: wails build
        working-directory: desktop
        env:
          AGENTHUB_RELEASE: ${{ steps.version.outputs.tag }}
          TAG: ${{ steps.version.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ldflags="-X agenthub.local/agenthub/internal/buildinfo.release=${TAG}"
          # main.release carries the bare number: the window prefixes "v" itself
          # (desktop/frontend/src/app.js, tested in test/version-line.mjs), so
          # stamping the tag verbatim would show "vv0.0.3".
          version="${TAG#v}"
          ldflags="$ldflags -X main.release=${version}"
          case "$PLATFORM" in
          windows/*) product_version="${version%%-*}" ;;
          *) product_version="$version" ;;
          esac
          jq --arg v "$product_version" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json
          echo "info.productVersion = $product_version"
          # Committed on the runner, not left as a working-tree edit: the Go
          # toolchain records vcs.modified=true for a dirty tree, and every
          # binary built from it — the window and the three bundled commands —
          # would then report "<tag> (modified source, ...)", which is the
          # string a stranger reads as "someone tampered with this". The commit
          # never leaves the runner; the checked-out tag is what is being built,
          # plus one number that belongs to the tag anyway.
          git -c user.name=release-workflow -c user.email=release@localhost \
            commit -qam "ci: stamp info.productVersion ${product_version} for ${TAG}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "the tree is not clean after stamping:"; git status --porcelain; exit 1
          fi
          case "$PLATFORM" in
          darwin/*)
            wails build -clean -platform "$PLATFORM" -ldflags "$ldflags"
            ;;
          windows/*)
            # Checked here rather than inferred from a missing file three steps
            # later: wails only warns when makensis is absent.
            command -v makensis
            makensis /VERSION || true
            echo
            # -o names the executable agenthub-desktop.exe, which is what
            # project.nsi installs as ${PRODUCT_EXECUTABLE} and what its
            # taskkill lines name; the wails.json outputfilename is "desktop".
            wails build -clean -platform "$PLATFORM" -ldflags "$ldflags" \
              -o agenthub-desktop.exe -nsis
            ;;
          linux/*)
            wails build -clean -platform "$PLATFORM" -ldflags "$ldflags" \
              -tags webkit2_41 -o agenthub-desktop
            ;;
          esac
          ls -l build/bin

      # The hook is the only thing standing between a released bundle and "ah
      # was not found" (bundle-binaries.sh says so at length). It runs inside
      # wails, where a failure is one line in a long log, so this asserts the
      # result instead of trusting it.
      - name: the bundled command line binaries are there
        working-directory: desktop
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
          darwin/*) beside=build/bin/agenthub-desktop.app/Contents/MacOS; suffix="" ;;
          windows/*) beside=build/bin; suffix=".exe" ;;
          *) beside=build/bin; suffix="" ;;
          esac
          for binary in ah agenthub-node agenthub-mcp; do
            if [ ! -f "${beside}/${binary}${suffix}" ]; then
              echo "the post-build hook did not bundle ${binary}${suffix} into ${beside}"
              ls -l "$beside"
              exit 1
            fi
          done
          echo "beside=$beside" >> "$GITHUB_ENV"

      # Only where the bundle is native. The stamping is one env var shared by
      # all three platforms, so it holds everywhere or nowhere — same argument
      # the build job makes for checking only linux/amd64.
      - name: the bundled ah reports the tag
        if: matrix.runner != 'windows-latest'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          reported=$("desktop/${beside}/ah" --version)
          echo "$reported"
          case "$reported" in
            *"modified source"*)
              echo "the bundled ah was built from a dirty tree: $reported"; git status --porcelain; exit 1 ;;
          esac
          case "$reported" in
            "ah ${TAG} "*) ;;
            *) echo "the bundled ah --version does not lead with ${TAG}"; exit 1 ;;
          esac

      # The version wails stamped, read back from the bundle rather than assumed
      # from the jq above. Getting this wrong is invisible until a stranger
      # files a bug against "1.0.0", which is every build ever made.
      - name: the app bundle reports the tag (macos)
        if: matrix.runner == 'macos-latest'
        working-directory: desktop
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          plist=build/bin/agenthub-desktop.app/Contents/Info.plist
          reported=$(defaults read "$PWD/$plist" CFBundleShortVersionString)
          echo "CFBundleShortVersionString = $reported"
          if [ "$reported" != "${TAG#v}" ]; then
            echo "the app bundle says $reported, not ${TAG#v}"
            exit 1
          fi

      # hdiutil rather than a third-party action: it is in the OS, it is what
      # Apple documents, and a .dmg is the only macOS download a stranger knows
      # what to do with. The Applications symlink is what makes the window a
      # drag-to-install rather than a folder with an app loose in it.
      #
      # Ad-hoc signed only, by bundle-binaries.sh — there is no certificate
      # (#66). codesign --verify is still worth running: on Apple silicon a
      # bundle whose seal is broken is killed at launch, not warned about, and
      # that is exactly what copying binaries into a signed bundle risks.
      - name: package the .dmg (macos)
        if: matrix.runner == 'macos-latest'
        working-directory: desktop
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SLUG: ${{ matrix.slug }}
        run: |
          app=build/bin/agenthub-desktop.app
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p ../dist dmg-root
          cp -R "$app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "AgentHub" -srcfolder dmg-root \
            -fs HFS+ -format UDZO -ov \
            "../dist/agenthub-desktop_${TAG}_${SLUG}.dmg"

      # Two files, because they answer different questions. The installer is
      # for someone who wants the app installed, the node registered and a
      # Start menu entry; the zip is for someone who wants to look at what they
      # downloaded, or to run it without an installer touching their machine.
      - name: package the installer and the zip (windows)
        if: matrix.runner == 'windows-latest'
        working-directory: desktop
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p ../dist
          # wails names it <project>-<arch>-installer.exe; matched by glob
          # rather than spelled out, because that name is wails' to change.
          installer=$(ls build/bin/*installer.exe)
          cp "$installer" "../dist/agenthub-desktop_${TAG}_${SLUG}-installer.exe"
          staging="agenthub-desktop_${TAG}_${SLUG}"
          mkdir -p "build/zip/${staging}"
          cp build/bin/agenthub-desktop.exe build/bin/ah.exe \
            build/bin/agenthub-node.exe build/bin/agenthub-mcp.exe \
            "build/zip/${staging}/"
          cp ../README.md ../LICENSE "build/zip/${staging}/"
          (cd build/zip && 7z a -tzip -bso0 "../../../dist/${staging}.zip" "$staging")

      # No Linux desktop packaging format is produced: .deb and .AppImage each
      # want a maintainer who tests them, and a tarball is honest about being a
      # directory you unpack. The README.txt is not decoration — the binary is
      # dynamically linked against the system WebKit, so the one thing a
      # downloader has to know is which package to install when it will not
      # start.
      - name: package the tarball (linux)
        if: matrix.runner == 'ubuntu-latest'
        working-directory: desktop
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p ../dist
          staging="agenthub-desktop_${TAG}_${SLUG}"
          mkdir -p "build/tar/${staging}"
          cp build/bin/agenthub-desktop build/bin/ah \
            build/bin/agenthub-node build/bin/agenthub-mcp \
            "build/tar/${staging}/"
          cp ../README.md ../LICENSE "build/tar/${staging}/"
          cat > "build/tar/${staging}/README.txt" <<EOF
          AgentHub desktop ${TAG} — linux/amd64

          Unpack anywhere and run ./agenthub-desktop. Keep ah, agenthub-node and
          agenthub-mcp in the same directory: the app resolves them beside its own
          executable and deliberately does not fall back to PATH.

          This build links the system WebKit at run time, so it needs the GTK and
          WebKit2GTK 4.1 runtime libraries installed:

            Debian / Ubuntu:  sudo apt install libgtk-3-0 libwebkit2gtk-4.1-0
            Fedora:           sudo dnf install gtk3 webkit2gtk4.1
            Arch:             sudo pacman -S gtk3 webkit2gtk-4.1

          A missing one shows up as the app exiting immediately with an error
          naming libwebkit2gtk-4.1.so.0.

          These files are not signed. Check them against SHA256SUMS on the
          release page before you run them.
          EOF
          tar -C build/tar -czf "../dist/${staging}.tar.gz" "$staging"

      - name: what was packaged
        run: ls -l dist

      # Uploaded on a dispatch as well as on a tag, which is the point of item 7
      # of #64: the artifacts of a rehearsal run are how anyone checks that the
      # .dmg mounts and the installer installs before a tag exists.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.slug }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: publish the release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    # This job runs on a rehearsal too, and that is the point: gathering six
    # uploads, folding their checksum files into one list, and assembling the
    # notes is the half no local run can cover. Only the last step — the one
    # that creates the release — is gated on a tag actually having been pushed.
    #
    # It grants write for both events. A dispatch already requires write access
    # to start, and this job runs no repository code: gh and coreutils over
    # artifacts the run itself produced.
    permissions:
      contents: write
    steps:
      # No checkout: `gh release create --repo` uses the API for everything,
      # including --verify-tag, so the one job that can write never has the
      # repository tree on disk.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # One list, over the archives themselves, so a downloader checks what they
      # downloaded rather than a per-platform file they would have to find. The
      # per-platform .sha256 files from the build jobs are folded into it and
      # not published separately: two lists that must agree eventually will not.
      - name: one checksum list for the release
        run: |
          cd dist
          rm -f ./*.sha256
          # Listed explicitly rather than with `./*`: on a second run in this
          # directory the glob would match the previous SHA256SUMS, which the
          # redirect has already truncated, and record the hash of the empty
          # string. The directory is fresh per run today, so this is about not
          # depending on that.
          shopt -s nullglob
          # agenthub_* is the command line archives, agenthub-desktop_* the app.
          # The two prefixes differ by the hyphen, so neither glob can pick up
          # the other's files.
          archives=(
            agenthub_*.tar.gz agenthub_*.zip
            agenthub-desktop_*.dmg agenthub-desktop_*.zip
            agenthub-desktop_*.tar.gz agenthub-desktop_*-installer.exe
          )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no archives were downloaded; nothing to publish"; exit 1
          fi
          # Every platform of both products, or the release is half a release
          # and nobody notices until someone looks for their download. Ten
          # files: four desktop (three platforms, with the Windows installer and
          # zip both counted) and the six command line archives — each of those
          # is one job, and a job that failed while the others passed is exactly
          # the case this catches.
          # The pattern is expanded inside the function, not by the for-list:
          # nullglob is on, so an unmatched pattern in a word list vanishes
          # instead of arriving as the string that was not matched.
          missing=()
          for expected in \
            'agenthub-desktop_*_darwin_universal.dmg' \
            'agenthub-desktop_*_windows_amd64-installer.exe' \
            'agenthub-desktop_*_windows_amd64.zip' \
            'agenthub-desktop_*_linux_amd64.tar.gz' \
            'agenthub_*_linux_amd64.tar.gz' \
            'agenthub_*_linux_arm64.tar.gz' \
            'agenthub_*_darwin_amd64.tar.gz' \
            'agenthub_*_darwin_arm64.tar.gz' \
            'agenthub_*_windows_amd64.zip' \
            'agenthub_*_windows_arm64.zip'; do
            found=($expected)
            [ ${#found[@]} -gt 0 ] || missing+=("$expected")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "an artifact is missing: ${missing[*]}"
            ls -l
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: assemble the release notes
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          notes=$(mktemp)
          {
            echo "Built from \`${GITHUB_SHA}\` by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}). MIT licensed; the LICENSE file travels inside every archive."
            echo
            # The desktop app first, because it is what most people came for
            # and the command line archives are the thing you reach for after.
            echo "## The desktop app"
            echo
            echo "One download, and it brings \`agenthub-node\`, \`ah\` and \`agenthub-mcp\` with it — the app runs them from beside its own executable, so there is nothing else to install and nothing to put on your PATH."
            echo
            echo "| Platform | Download | What to do with it |"
            echo "|---|---|---|"
            echo "| macOS (Apple silicon and Intel) | \`agenthub-desktop_${TAG}_darwin_universal.dmg\` | Open it, drag \`agenthub-desktop.app\` to Applications. The first launch needs one extra step (see below). |"
            echo "| Windows 10/11 (x64) | \`agenthub-desktop_${TAG}_windows_amd64-installer.exe\` | Run it. It installs the app, registers the background node and adds a Start menu entry. |"
            echo "| Windows, no installer | \`agenthub-desktop_${TAG}_windows_amd64.zip\` | Unpack it and run \`agenthub-desktop.exe\`; keep the other three files beside it. |"
            echo "| Linux (x64) | \`agenthub-desktop_${TAG}_linux_amd64.tar.gz\` | Unpack it and run \`./agenthub-desktop\`. Needs GTK 3 and WebKit2GTK 4.1 — the README.txt inside names the package. |"
            echo
            echo "## Command line only"
            echo
            echo "\`agenthub_${TAG}_<os>_<arch>.{tar.gz,zip}\` holds the same three binaries without the app, for six platforms. Unpack one and put the binaries on your PATH."
            echo
            echo "Every binary reports this tag: \`ah --version\` says \`ah ${TAG} …\`, the node logs it at startup, and \`agenthub-mcp\` sends it at initialize. That includes the copies inside the desktop bundle."
            echo
            echo "Verify a download against \`SHA256SUMS\`:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            # On the page as well as in the file: someone deciding whether to
            # trust a download should not have to download something first.
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            # Unsigned is a choice (issue #66), so the page says so rather
            # than letting the first warning be a surprise. It sits right after
            # the hashes because the checksum is what stands in for a
            # signature here, and a reader should meet both at once.
            echo "Nothing here is **code-signed or notarized** (issue #66), so every platform will say so before it lets you run anything. That is expected; check the hash above before you override any of it, because it is the only evidence you have that the download is what this workflow built."
            echo
            echo "- **macOS.** The app is ad-hoc signed, which is enough to launch but not enough for Gatekeeper. On **macOS 15 Sequoia and later**, after dragging \`agenthub-desktop.app\` to Applications: double-click it, get the \"cannot be opened\" / \"Apple could not verify\" dialog, click **Done**, then open **System Settings → Privacy & Security**, scroll down to **Security**, click **Open Anyway** next to the app's name and confirm. Sequoia removed the old right-click → **Open** bypass; on macOS 14 and earlier that still works. Either way, the terminal route is \`xattr -dr com.apple.quarantine /Applications/agenthub-desktop.app\`. Loose command line binaries take the same Privacy & Security detour, or \`xattr -d com.apple.quarantine <file>\`."
            echo "- **Windows.** SmartScreen calls the publisher unknown: More info → Run anyway."
            echo "- **Linux.** No equivalent gate; \`chmod +x\` if the executable bit did not survive."
            echo
            echo "\`agenthub-node\` serves the owner's API on loopback only. Sharing with another machine is the peer listener, with \`-allow-lan\` and \`-peer-listen\`; see the README."
          } > "$notes"
          echo "notes=$notes" >> "$GITHUB_ENV"
          echo "--- release notes ---"
          cat "$notes"
          echo "--- files that would be attached ---"
          ls -l dist

      # The only step a tag adds. Everything above it has run on the rehearsal.
      - name: publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$notes" \
            --verify-tag \
            dist/*
